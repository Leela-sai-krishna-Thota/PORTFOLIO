  </defs>
  <!-- Stylized Monogram Logo "LK" -->
  <text x="50" y="62" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="46" fill="url(#faviconGradient)" letter-spacing="-2">LK</text>
</svg>
